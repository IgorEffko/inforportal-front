<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>InfoPortal • Cadastro</title>

    <link
        rel="stylesheet"
        href="../css/cadastro.css"
    >

</head>


<body>

    <header class="header">

        <div class="header-container">

            <a
                href="index.html"
                class="logo"
            >
                INFO<span>PORTAL</span>
            </a>


            <nav class="menu">

                <a href="index.html">
                    Início
                </a>

                <a href="busca.html">
                    Buscar
                </a>

                <a href="login.html">
                    Entrar
                </a>

            </nav>

        </div>

    </header>


    <main class="main">

        <section class="cadastro-card">

            <div class="cabecalho">

                <h1>
                    Criar sua conta
                </h1>

                <p>
                    Faça seu cadastro para participar do InfoPortal.
                </p>

            </div>


            <form id="cadastroForm">


                <!-- NOME -->

                <div class="campo">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- E-MAIL -->

                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- DATA DE NASCIMENTO -->

                <div class="campo">

                    <label for="dataNascimento">
                        Data de nascimento
                    </label>

                    <input
                        type="date"
                        id="dataNascimento"
                        name="dataNascimento"
                        required
                    >

                    <small>
                        Necessária para validação das regras de idade.
                    </small>

                </div>


                <!-- SENHA -->

                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Mínimo de 6 caracteres"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- CONFIRMAR SENHA -->

                <div class="campo">

                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        name="confirmarSenha"
                        placeholder="Digite a senha novamente"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- CONVITE JORNALISTA -->

                <div class="jornalista-box">

                    <div class="jornalista-titulo">

                        <input
                            type="checkbox"
                            id="jornalista"
                        >

                        <label for="jornalista">
                            Sou jornalista
                        </label>

                    </div>


                    <p>
                        Possui um convite corporativo?
                        Informe o código para solicitar
                        o perfil de jornalista.
                    </p>


                    <div
                        id="conviteContainer"
                        class="convite-container"
                    >

                        <label for="codigoConvite">
                            Código do convite
                        </label>

                        <input
                            type="text"
                            id="codigoConvite"
                            placeholder="Digite o código"
                        >

                    </div>

                </div>


                <!-- MENSAGEM -->

                <div
                    id="mensagem"
                    class="mensagem"
                ></div>


                <button
                    type="submit"
                    class="btn-cadastrar"
                >
                    Criar conta
                </button>


            </form>


            <div class="login-link">

                Já possui uma conta?

                <a href="login.html">
                    Entrar
                </a>

            </div>

        </section>

    </main>


    <footer class="footer">

        <p>
            InfoPortal © 2026
        </p>

    </footer>


    <script src="../js/cadastro.js"></script>

</body>

</html>
